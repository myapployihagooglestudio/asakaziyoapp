    <script>
      (function() {
        // Intercept only Vite HMR WebSocket connections in AI Studio preview where HMR is disabled
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr =
                (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('__vite') !== -1)) ||
                (Array.isArray(protocols) ? protocols.indexOf('vite-hmr') !== -1 : protocols === 'vite-hmr');

              if (isViteHmr) {
                try {
                  var target = new EventTarget();
                  target.url = url;
                  target.protocols = protocols;
                  target.CONNECTING = 0;
                  target.OPEN = 1;
                  target.CLOSING = 2;
                  target.CLOSED = 3;
                  target.readyState = 1;
                  target.binaryType = 'blob';
                  target.bufferedAmount = 0;
                  target.extensions = '';
                  target.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
                  target.send = function() {};
                  target.close = function() { target.readyState = 3; };
                  setTimeout(function() {
                    try {
                      var openEvt = new Event('open');
                      if (typeof target.onopen === 'function') target.onopen(openEvt);
                      target.dispatchEvent(openEvt);
                    } catch (_) {}
                  }, 0);
                  return target;
                } catch (_) {
                  return {
                    url: url,
                    readyState: 1,
                    send: function() {},
                    close: function() {},
                    addEventListener: function() {},
                    removeEventListener: function() {}
                  };
                }
              }
              return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        window.addEventListener('error', function(e) {
          if (e && ((e.message && e.message.indexOf('WebSocket') !== -1 && e.filename && e.filename.indexOf('client') !== -1) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).indexOf('vite-hmr') !== -1) {
            e.preventDefault();
            return true;
          }
        });
      })();
    </script>

    <script>
      (function() {
        try {
          var raw = localStorage.getItem('asaka_ziyo_settings');
          var theme = raw ? JSON.parse(raw).theme : 'dark';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (_) {}
      })();
