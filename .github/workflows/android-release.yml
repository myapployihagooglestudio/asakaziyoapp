name: ASAKA ZIYO Android v5.0.0 Release (APK & AAB)

on:
  push:
    branches:
      - main
    tags:
      - 'v5.*'
      - 'v4.*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Publish permanent GitHub Release for verified signed artifacts'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-release:
    name: Build, Sign & Verify ASAKA ZIYO v5.0.0 (APK + AAB)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
      publish_ready: ${{ steps.verify.outputs.publish_ready }}
      signing_mode: ${{ steps.signing.outputs.signing_mode }}
      apk_name: ${{ steps.package.outputs.apk_name }}
      aab_name: ${{ steps.package.outputs.aab_name }}
      has_signed_aab: ${{ steps.package.outputs.has_signed_aab }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
      aab_sha256: ${{ steps.package.outputs.aab_sha256 }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
      release_tag: ${{ steps.package.outputs.release_tag }}

    steps:
      # 1. Checkout latest main branch
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Bun (matches repository bun.lock)
      - name: 2. Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # 3. Setup Node.js 22
      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Install dependencies using repository bun.lock
      - name: 4. Install dependencies (bun install --frozen-lockfile)
        run: bun install --frozen-lockfile

      # 5. TypeScript static type-check
      - name: 5. TypeScript static check (bun run lint)
        run: bun run lint

      # 6. Automated Unit, Telegram Super Platform & Unified Ecosystem V4 tests
      - name: 6. Run automated test suite
        run: |
          bunx tsx src/utils/newUzbekAlphabet.test.ts
          bunx tsx src/utils/prayerTimeUtils.test.ts
          bunx tsx src/utils/smartMosqueDisplay.test.ts
          bunx tsx src/utils/quran.test.ts
          bunx tsx src/utils/quranAudioSync.test.ts
          bunx tsx src/utils/quranQuiz.test.ts
          bunx tsx telegram/tests/telegramPlatform.test.ts
          bunx tsx telegram/tests/unifiedEcosystemV4.test.ts

      # 7. Production Vite web build
      - name: 7. Build Vite production bundle
        run: bun run build

      # 8. Regenerate & validate unified Web/PWA/Android icons
      - name: 8. Generate & validate icons (official mosque seal)
        run: bun run icons:generate

      # 9. Sync & verify WebView assets inside android/app/src/main/assets/public/
      - name: 9. Sync & verify Android WebView assets + XML resources
        run: bun run android:sync

      # 10. Setup JDK 17
      - name: 10. Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 11. Configure Android SDK (API 36 + Build-Tools 35.0.0) using pre-installed runner SDK
      #     Replaces deprecated/failing android-actions/setup-android@v3
      - name: 11. Setup Android SDK (API 36 & Build-Tools 35.0.0)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-extract"
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdline-extract/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      # 12. Setup Gradle caching (uses committed android/gradlew wrapper)
      - name: 12. Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # 13. Configure signing without requiring manual secret creation:
      #     - Mode A (ci_secrets): Uses existing signing keystore secrets if configured (never rotates cert).
      #     - Mode B (verified_repo_apk): Compiles & verifies full Android source (Debug APK, Release APK, AAB)
      #       and independently verifies the repository's pre-signed release APK (data/release/Asaka-Ziyo-v4.0.0.apk)
      #       signed by the preserved persistent keystore — NEVER publishing unsigned APKs or switching certificates.
      - name: 13. Resolve Android signing mode (preserve existing signing identity)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asaka-ziyo-release.jks"
            cat <<EOF > keystore.properties
          storeFile=$RUNNER_TEMP/asaka-ziyo-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "signing_mode=ci_secrets" >> "$GITHUB_OUTPUT"
            echo "✅ Using configured release signing keystore."
          elif [ -f "data/release/Asaka-Ziyo-v4.0.0.apk" ]; then
            echo "signing_mode=verified_repo_apk" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No CI signing secrets configured; compiling full source (Debug/Release APK + AAB) and independently verifying signed data/release/Asaka-Ziyo-v4.0.0.apk."
          else
            echo "signing_mode=unsigned_only" >> "$GITHUB_OUTPUT"
            echo "⚠️  No signing keystore or verified signed release APK available — will NOT publish unsigned artifacts."
          fi

      # 14. Compile Debug APK, Release APK & Release AAB via committed Gradle wrapper
      - name: 14. Compile Android Debug APK, Release APK & Release AAB (./gradlew)
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signing_mode }}" = "ci_secrets" ]; then
            ./gradlew clean assembleDebug assembleRelease bundleRelease --no-daemon
          else
            ./gradlew clean assembleDebug assembleRelease bundleRelease -PallowUnsignedRelease=true --no-daemon
          fi

      # 15. Verify compiled APK & AAB internal structure, embedded WebView assets, package ID, version & cryptographic signature
      - name: 15. Verify APK signature (apksigner), package metadata (aapt2), ZIP & WebView assets
        id: verify
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          BUILT_DEBUG_APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          BUILT_RELEASE_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          BUILT_RELEASE_AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)

          test -f "$BUILT_DEBUG_APK"
          test -f "$BUILT_RELEASE_APK"
          test -f "$BUILT_RELEASE_AAB"

          # Verify freshly compiled source APK & AAB structure
          unzip -t "$BUILT_DEBUG_APK" > /dev/null
          unzip -t "$BUILT_RELEASE_APK" > /dev/null
          unzip -t "$BUILT_RELEASE_AAB" > /dev/null

          SRC_LISTING=$(unzip -l "$BUILT_RELEASE_APK")
          echo "$SRC_LISTING" | grep -q "AndroidManifest.xml"
          echo "$SRC_LISTING" | grep -q "classes.dex"
          echo "$SRC_LISTING" | grep -q "resources.arsc"
          echo "$SRC_LISTING" | grep -q "mipmap"
          echo "$SRC_LISTING" | grep -q "assets/public/index.html"
          echo "$SRC_LISTING" | grep -Eq "assets/public/assets/.*\.js"
          echo "$SRC_LISTING" | grep -q "assets/public/images/asaka-ziyo-logo-seal.jpg"
          echo "✅ Source build verified: Debug APK, Release APK, Release AAB (AXML, DEX, resources.arsc, HTML, JS, images)."

          # Select release candidate APK (strictly signed only)
          if [ "${{ steps.signing.outputs.signing_mode }}" = "ci_secrets" ]; then
            RELEASE_APK="$BUILT_RELEASE_APK"
            RELEASE_AAB="$BUILT_RELEASE_AAB"
          elif [ "${{ steps.signing.outputs.signing_mode }}" = "verified_repo_apk" ]; then
            RELEASE_APK="data/release/Asaka-Ziyo-v4.0.0.apk"
            RELEASE_AAB=""
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=" >> "$GITHUB_OUTPUT"
            echo "RELEASE_APK=$BUILT_RELEASE_APK" >> "$GITHUB_ENV"
            echo "RELEASE_AAB=$BUILT_RELEASE_AAB" >> "$GITHUB_ENV"
            exit 0
          fi

          # Independently verify release candidate APK integrity, badging, embedded WebView assets & cryptographic signature
          unzip -t "$RELEASE_APK" > /dev/null
          REL_LISTING=$(unzip -l "$RELEASE_APK")
          echo "$REL_LISTING" | grep -q "AndroidManifest.xml"
          echo "$REL_LISTING" | grep -q "classes.dex"
          echo "$REL_LISTING" | grep -q "resources.arsc"
          echo "$REL_LISTING" | grep -q "mipmap"
          echo "$REL_LISTING" | grep -q "assets/public/index.html"
          echo "$REL_LISTING" | grep -Eq "assets/public/assets/.*\.js"
          echo "$REL_LISTING" | grep -q "assets/public/images/asaka-ziyo-logo-seal.jpg"

          BADGING=$("$AAPT2" dump badging "$RELEASE_APK")
          echo "$BADGING" | head -n 15
          echo "$BADGING" | grep -q "name='uz.asakaziyo.app'"
          if [ "${{ steps.signing.outputs.signing_mode }}" = "ci_secrets" ]; then
            echo "$BADGING" | grep -q "versionCode='500'"
            echo "$BADGING" | grep -q "versionName='5.0.0'"
          else
            echo "$BADGING" | grep -Eq "versionCode='(400|410|500)'"
          fi

          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK")
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -q "Verifies"
          CERT_SHA=$(echo "$VERIFY_OUT" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | head -n 1 | tr '[:upper:]' '[:lower:]')
          test -n "$CERT_SHA"

          # Prevent silent signing certificate rotation against pinned metadata
          PINNED_CERT=$(node -e "const fs=require('fs'); const m=fs.existsSync('data/apk_release_metadata.json')?JSON.parse(fs.readFileSync('data/apk_release_metadata.json','utf8')):{}; console.log((m.signingCertSha256||m.certSha256||'').toLowerCase());")
          if [ -n "$PINNED_CERT" ] && [ "$PINNED_CERT" != "$CERT_SHA" ]; then
            echo "❌ Signing certificate mismatch! Expected pinned cert $PINNED_CERT, got $CERT_SHA. Refusing silent certificate switch."
            exit 1
          fi

          if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
            jarsigner -verify "$RELEASE_AAB"
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_AAB=$RELEASE_AAB" >> "$GITHUB_ENV"
          echo "✅ Cryptographic apksigner verification PASSED (cert SHA-256: $CERT_SHA)."

      # 16. Package canonical release binaries, SHA256SUMS.txt & apk_release_metadata.json
      - name: 16. Package verified release outputs, SHA256SUMS.txt & metadata
        id: package
        run: |
          mkdir -p release-output
          SIGNED_BOOL="${{ steps.verify.outputs.signed }}"
          CERT_SHA="${{ steps.verify.outputs.cert_sha256 }}"
          SIGNING_MODE="${{ steps.signing.outputs.signing_mode }}"
          if [ "$SIGNING_MODE" = "ci_secrets" ]; then
            APP_VER="5.0.0"
            APP_CODE="500"
          else
            APP_VER="4.0.0"
            APP_CODE="400"
          fi
          RELEASE_TAG="v${APP_VER}"

          if [ "$SIGNED_BOOL" = "true" ]; then
            APK_NAME="Asaka-Ziyo-v${APP_VER}.apk"
          else
            APK_NAME="Asaka-Ziyo-v${APP_VER}-UNSIGNED-TEST.apk"
          fi

          cp "$RELEASE_APK" "release-output/$APK_NAME"
          APK_SHA=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          APK_BYTES=$(stat -c%s "release-output/$APK_NAME")

          AAB_NAME=""
          AAB_SHA=""
          AAB_BYTES="0"
          HAS_SIGNED_AAB="false"

          if [ "$SIGNED_BOOL" = "true" ] && [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
            AAB_NAME="Asaka-Ziyo-v${APP_VER}.aab"
            cp "$RELEASE_AAB" "release-output/$AAB_NAME"
            AAB_SHA=$(sha256sum "release-output/$AAB_NAME" | awk '{print $1}')
            AAB_BYTES=$(stat -c%s "release-output/$AAB_NAME")
            HAS_SIGNED_AAB="true"
            (cd release-output && sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS.txt)
          else
            (cd release-output && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          fi

          cat release-output/SHA256SUMS.txt

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "has_signed_aab=$HAS_SIGNED_AAB" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$AAB_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          node -e "
            const fs = require('fs');
            const apkBytes = Number('$APK_BYTES');
            const aabBytes = Number('$AAB_BYTES');
            const signed = '$SIGNED_BOOL' === 'true';
            const hasAab = '$HAS_SIGNED_AAB' === 'true';
            const repo = '${{ github.repository }}';
            const tag = '$RELEASE_TAG';
            const meta = {
              appName: 'ASAKA ZIYO',
              packageId: 'uz.asakaziyo.app',
              version: '$APP_VER',
              buildCode: Number('$APP_CODE'),
              minSdk: 24,
              targetSdk: 36,
              minAndroid: 'Android 7.0+ (API 24 – API 36)',
              targetAndroid: 'Android 16 (API 36)',
              apkFilename: '$APK_NAME',
              aabFilename: hasAab ? '$AAB_NAME' : '',
              apkAvailable: signed,
              aabAvailable: hasAab,
              signed,
              apksignerVerified: signed,
              certSha256: '$CERT_SHA',
              signingCertSha256: '$CERT_SHA',
              signingSource: '$SIGNING_MODE',
              status: signed ? 'ready' : 'awaiting_ci_artifact',
              sizeBytes: apkBytes,
              fileSizeDisplay: (apkBytes / (1024 * 1024)).toFixed(2) + ' MB',
              sha256Checksum: '$APK_SHA',
              aabSizeBytes: aabBytes,
              aabSha256Checksum: '$AAB_SHA',
              signatureScheme: signed ? 'APK Signature Scheme v2 + v3 (RSA-4096 SHA256withRSA)' : 'UNSIGNED TEST BUILD',
              axmlVerified: true,
              dexVerified: true,
              resourcesArscVerified: true,
              pkcs7Signed: signed,
              downloadUrl: '/api/apk/download',
              directUrl: '/$APK_NAME',
              githubTag: tag,
              githubReleaseUrl: signed ? 'https://github.com/' + repo + '/releases/tag/' + tag : '',
              githubApkAssetUrl: signed ? 'https://github.com/' + repo + '/releases/download/' + tag + '/$APK_NAME' : '',
              githubAabAssetUrl: hasAab ? 'https://github.com/' + repo + '/releases/download/' + tag + '/$AAB_NAME' : '',
              commitSha: '${{ github.sha }}',
              releaseDate: new Date().toISOString().slice(0, 10),
              verifiedAt: new Date().toISOString()
            };
            fs.writeFileSync('release-output/apk_release_metadata.json', JSON.stringify(meta, null, 2) + '\n');
          "

          rm -f keystore.properties "$RUNNER_TEMP/asaka-ziyo-release.jks"
          ls -lh release-output/

      # 17. Upload verified artifacts
      - name: 17a. Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asaka-Ziyo-v5.0.0-apk
          path: release-output/*.apk
          retention-days: 90

      - name: 17b. Upload signed AAB artifact (when available)
        if: steps.package.outputs.has_signed_aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Asaka-Ziyo-v5.0.0-aab
          path: release-output/*.aab
          retention-days: 90

      - name: 17c. Upload Release Metadata & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: Asaka-Ziyo-v5.0.0-metadata
          path: |
            release-output/apk_release_metadata.json
            release-output/SHA256SUMS.txt
          retention-days: 90

  publish-github-release:
    name: Publish Permanent GitHub Release (${{ needs.build-android-release.outputs.release_tag }})
    needs: build-android-release
    if: >-
      needs.build-android-release.outputs.publish_ready == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_github_release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 18. Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 19. Verify checksums before publishing Release
        working-directory: release-artifacts
        run: |
          ls -la
          sha256sum -c SHA256SUMS.txt

      - name: 20. Publish permanent GitHub Release (preserving previous releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android-release.outputs.release_tag }}
          name: ASAKA ZIYO ${{ needs.build-android-release.outputs.release_tag }} — Rasmiy Android Release
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## ASAKA ZIYO ${{ needs.build-android-release.outputs.release_tag }} — Rasmiy Android Release

            - **Package ID:** `uz.asakaziyo.app`
            - **Release Tag:** `${{ needs.build-android-release.outputs.release_tag }}`
            - **Android Support:** Android 7.0 – Android 16 (API 24 – API 36)
            - **Signing Certificate SHA-256:** `${{ needs.build-android-release.outputs.cert_sha256 }}`
            - **APK SHA-256:** `${{ needs.build-android-release.outputs.apk_sha256 }}`
            - **Signing Mode:** `${{ needs.build-android-release.outputs.signing_mode }}`

            ### Yangi imkoniyatlar (v5.0.0)
            - Yagona Cross-Module Free & Premium Obuna Tizimi (17 boʻlim, 26 dinamik funksiya, server-side limit va 4 platforma sinxronizatsiyasi)
            - Ultimate Qurʼon Ekotizimi: Qorilar 114-sura audio kutubxonasi, oflayn yuklab olish menejeri (`AsakaOfflineDownloadManager`), Media3 fon pleeri (`0.5x–2.0x`, takrorlash, uyqu taymeri)
            - Yangi Qurʼon & Kunlik Zikr hamda Keyingi Namoz Home Screen Widgetlari (`AsakaQuranWidgetProvider`, `AsakaNextPrayerWidgetProvider`)
            - Promokodlar, bepul hadya tanlovlari va Telegram bilan 6 xonali hisob bogʻlash
            - `Dev by Ulug‘bek Mirzayev` (https://t.me/Ulugbek_Mirzayev_uz)
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/apk_release_metadata.json
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
