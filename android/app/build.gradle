plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystoreProps = new Properties()
def rootKeystoreFile = rootProject.file("../keystore.properties")
def androidKeystoreFile = rootProject.file("keystore.properties")
if (rootKeystoreFile.exists()) {
    keystoreProps.load(new FileInputStream(rootKeystoreFile))
} else if (androidKeystoreFile.exists()) {
    keystoreProps.load(new FileInputStream(androidKeystoreFile))
}

def resolveSigningValue = { String propKey, String envKey ->
    return keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
}

android {
    namespace "uz.asakaziyo.app"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
        compose = true
    }

    defaultConfig {
        applicationId "uz.asakaziyo.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 700
        versionName "7.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        base.archivesName = "Asaka-Ziyo-v${versionName}"

        buildConfigField "String", "BACKEND_BASE_URL", "\"https://asakaziyo.ai.studio\""
        buildConfigField "String", "DEVELOPER_TELEGRAM_URL", "\"https://t.me/Ulugbek_Mirzayev_uz\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        release {
            def keystorePath = resolveSigningValue("storeFile", "ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword resolveSigningValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias resolveSigningValue("keyAlias", "ANDROID_KEY_ALIAS") ?: "asakaziyo"
                keyPassword resolveSigningValue("keyPassword", "ANDROID_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePath = resolveSigningValue("storeFile", "ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && new File(keystorePath).exists()) {
                signingConfig signingConfigs.release
            } else if (!project.hasProperty("allowUnsignedRelease")) {
                // Never silently sign Play Store release artifacts with the debug key
                signingConfig null
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX & SplashScreen
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.fragment:fragment-ktx:$androidxFragmentVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Jetpack Compose + Material 3 + Animation + Navigation
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"

    // MVVM Lifecycle + Coroutines
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // Offline-First Persistence, WorkManager, Security Keystore & Biometric
    implementation "androidx.datastore:datastore-preferences:$datastoreVersion"
    implementation "androidx.work:work-runtime-ktx:$workManagerVersion"
    implementation "androidx.biometric:biometric:$biometricVersion"
    implementation "androidx.security:security-crypto:$securityCryptoVersion"

    // Media3 ExoPlayer & Background MediaSession Service
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // Unified Firebase (FCM Push + Firestore + Auth — preserving existing project)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    debugImplementation "androidx.compose.ui:ui-tooling"
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
